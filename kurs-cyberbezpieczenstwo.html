<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cybersecurity Control Playbook — Kurs ekspercki</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  :root {
    --bg:        #0f1117;
    --surface:   #171b26;
    --border:    #252a38;
    --accent:    #00d4aa;
    --accent2:   #7c6bff;
    --text:      #e2e8f0;
    --muted:     #6b7a99;
    --danger:    #ff6b6b;
    --warning:   #ffd166;
    --sidebar-w: 300px;
    --font-sans: 'IBM Plex Sans', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --font-serif:'Lora', Georgia, serif;
  }

  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,600;1,400&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { font-size: 16px; scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    display: flex;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── SIDEBAR ────────────────────────────────────────────── */
  #sidebar {
    width: var(--sidebar-w);
    height: 100vh;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; left: 0;
    overflow-y: hidden;
    z-index: 100;
    transition: transform .3s ease;
  }

  .sidebar-header {
    padding: 28px 20px 20px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }

  .sidebar-logo .icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }

  .sidebar-logo h1 {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
    letter-spacing: .02em;
  }

  .sidebar-logo p {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* Progress bar */
  .progress-wrap {
    margin-top: 12px;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .progress-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width .4s ease;
  }

  /* Nav list */
  .nav-section {
    padding: 16px 12px 8px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .1em;
    color: var(--muted);
    text-transform: uppercase;
  }

  #navList { padding: 0 8px; flex: 1 1 0; overflow-y: auto; min-height: 0; }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s, color .15s;
    margin-bottom: 2px;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    color: var(--muted);
  }

  .nav-item:hover { background: var(--border); color: var(--text); }

  .nav-item.active {
    background: rgba(0,212,170,.12);
    color: var(--accent);
  }

  .nav-item.done { color: var(--text); }
  .nav-item.done .nav-check { color: var(--accent); }

  .nav-num {
    width: 22px; height: 22px;
    border-radius: 6px;
    background: var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    font-weight: 600;
    flex-shrink: 0;
  }

  .nav-item.done .nav-num {
    background: rgba(0,212,170,.2);
    color: var(--accent);
  }

  .nav-item.active .nav-num {
    background: var(--accent);
    color: #000;
  }

  .nav-txt { flex: 1; min-width: 0; }
  .nav-title {
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: block;
  }
  .nav-meta {
    font-size: 10px;
    color: var(--muted);
    display: block;
    margin-top: 1px;
  }

  .nav-check { font-size: 12px; flex-shrink: 0; }

  /* Sidebar footer */
  .sidebar-footer {
    flex-shrink: 0;
    padding: 12px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .btn-xml {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: none;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    transition: all .15s;
    width: 100%;
    font-family: var(--font-sans);
  }

  .btn-xml:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,212,170,.06);
  }

  /* ── MAIN ───────────────────────────────────────────────── */
  #main {
    margin-left: var(--sidebar-w);
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* Top bar */
  #topbar {
    position: sticky;
    top: 0;
    background: rgba(15,17,23,.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 12px 40px;
    display: flex;
    align-items: center;
    gap: 16px;
    z-index: 50;
  }

  #menuBtn {
    display: none;
    background: none;
    border: none;
    color: var(--text);
    font-size: 20px;
    cursor: pointer;
    padding: 4px;
  }

  .tab-bar {
    display: flex;
    gap: 4px;
    background: var(--surface);
    padding: 4px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }

  .tab-btn {
    padding: 6px 16px;
    border-radius: 7px;
    border: none;
    background: none;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all .15s;
    font-family: var(--font-sans);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .tab-btn:hover { color: var(--text); }

  .tab-btn.active {
    background: var(--bg);
    color: var(--text);
    box-shadow: 0 1px 3px rgba(0,0,0,.4);
  }

  .tab-btn .tab-icon { font-size: 14px; }

  .topbar-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    margin-left: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .topbar-badge {
    margin-left: auto;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    flex-shrink: 0;
  }

  .badge-basic    { background: rgba(107,123,153,.2); color: var(--muted); }
  .badge-medium   { background: rgba(255,209,102,.15); color: var(--warning); }
  .badge-advanced { background: rgba(255,107,107,.15); color: var(--danger); }

  /* ── CONTENT PANEL ──────────────────────────────────────── */
  #contentPanel {
    flex: 1;
    padding: 48px 60px 80px;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
  }

  /* Loading */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 300px;
    color: var(--muted);
    font-size: 14px;
    gap: 12px;
  }

  .spinner {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── MARKDOWN STYLES ────────────────────────────────────── */
  .md-body {
    font-family: var(--font-serif);
    font-size: 17px;
    line-height: 1.85;
    color: #cdd6e8;
  }

  .md-body h1 {
    font-family: var(--font-sans);
    font-size: 32px;
    font-weight: 600;
    color: var(--text);
    margin: 0 0 8px;
    line-height: 1.2;
    letter-spacing: -.02em;
  }

  .md-body .lead {
    font-size: 18px;
    color: var(--muted);
    margin-bottom: 40px;
    font-style: italic;
    font-family: var(--font-serif);
    line-height: 1.6;
    border-left: 3px solid var(--accent);
    padding-left: 20px;
  }

  .md-body h2 {
    font-family: var(--font-sans);
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    margin: 48px 0 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    letter-spacing: -.01em;
  }

  .md-body h3 {
    font-family: var(--font-sans);
    font-size: 17px;
    font-weight: 600;
    color: var(--accent);
    margin: 32px 0 12px;
    letter-spacing: .02em;
    text-transform: uppercase;
    font-size: 13px;
  }

  .md-body h4 {
    font-family: var(--font-sans);
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    margin: 24px 0 8px;
  }

  .md-body p { margin-bottom: 20px; }

  .md-body strong {
    color: var(--text);
    font-weight: 600;
    font-family: var(--font-sans);
  }

  .md-body em { color: #a8b8d0; }

  .md-body ul, .md-body ol {
    padding-left: 24px;
    margin-bottom: 20px;
  }

  .md-body li { margin-bottom: 8px; }

  .md-body blockquote {
    border-left: 3px solid var(--accent2);
    padding: 16px 20px;
    margin: 28px 0;
    background: rgba(124,107,255,.06);
    border-radius: 0 8px 8px 0;
    font-style: italic;
    color: #a8b8d0;
  }

  .md-body code {
    font-family: var(--font-mono);
    font-size: 13px;
    background: var(--border);
    padding: 2px 6px;
    border-radius: 4px;
    color: var(--accent);
  }

  .md-body pre {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    overflow-x: auto;
    margin: 24px 0;
  }

  .md-body pre code {
    background: none;
    padding: 0;
    color: var(--text);
    font-size: 13px;
  }

  .md-body table {
    width: 100%;
    border-collapse: collapse;
    margin: 28px 0;
    font-family: var(--font-sans);
    font-size: 14px;
  }

  .md-body th {
    background: var(--surface);
    padding: 10px 14px;
    text-align: left;
    color: var(--accent);
    font-weight: 600;
    font-size: 12px;
    letter-spacing: .05em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
  }

  .md-body td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    line-height: 1.5;
  }

  .md-body tr:last-child td { border-bottom: none; }
  .md-body tr:nth-child(even) td { background: rgba(255,255,255,.02); }

  .md-body hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 40px 0;
  }

  /* Callout boxes via blockquote with special markers */
  .callout {
    padding: 16px 20px;
    border-radius: 10px;
    margin: 28px 0;
    border: 1px solid;
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.6;
  }

  .callout-warn {
    background: rgba(255,209,102,.07);
    border-color: rgba(255,209,102,.3);
    color: #e8d5a0;
  }

  .callout-tip {
    background: rgba(0,212,170,.07);
    border-color: rgba(0,212,170,.3);
    color: #9eeedd;
  }

  .callout-danger {
    background: rgba(255,107,107,.07);
    border-color: rgba(255,107,107,.3);
    color: #f0b0b0;
  }

  /* Module header */
  .module-header {
    margin-bottom: 40px;
    padding-bottom: 32px;
    border-bottom: 1px solid var(--border);
  }

  .module-meta {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .meta-chip {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    font-family: var(--font-sans);
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  .chip-module  { background: rgba(0,212,170,.15); color: var(--accent); }
  .chip-time    { background: rgba(107,123,153,.15); color: var(--muted); }
  .chip-chapter { background: rgba(124,107,255,.15); color: var(--accent2); }

  /* ── QUIZ PANEL ─────────────────────────────────────────── */
  #quizPanel {
    max-width: 700px;
    margin: 0 auto;
  }

  .quiz-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px;
    margin-bottom: 24px;
  }

  .quiz-q {
    font-family: var(--font-sans);
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 28px;
    line-height: 1.4;
  }

  .quiz-opts {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .quiz-opt {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 18px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    cursor: pointer;
    transition: all .15s;
    text-align: left;
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
  }

  .quiz-opt:hover { border-color: var(--accent2); background: rgba(124,107,255,.06); }
  .quiz-opt.selected { border-color: var(--accent2); background: rgba(124,107,255,.1); }
  .quiz-opt.correct  { border-color: var(--accent); background: rgba(0,212,170,.1); }
  .quiz-opt.wrong    { border-color: var(--danger); background: rgba(255,107,107,.08); }
  .quiz-opt:disabled { cursor: default; }

  .opt-letter {
    width: 26px; height: 26px;
    border-radius: 6px;
    background: var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 1px;
    font-family: var(--font-mono);
  }

  .quiz-opt.correct .opt-letter { background: var(--accent); color: #000; }
  .quiz-opt.wrong   .opt-letter { background: var(--danger); color: #fff; }

  .quiz-feedback {
    margin-top: 20px;
    padding: 16px 20px;
    border-radius: 10px;
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.6;
    display: none;
  }

  .quiz-feedback.show { display: block; }
  .quiz-feedback.ok   { background: rgba(0,212,170,.1); border: 1px solid rgba(0,212,170,.3); color: #9eeedd; }
  .quiz-feedback.fail { background: rgba(255,107,107,.08); border: 1px solid rgba(255,107,107,.3); color: #f0b0b0; }

  /* ── COMPLETE BUTTON ────────────────────────────────────── */
  .complete-bar {
    position: sticky;
    bottom: 0;
    background: rgba(15,17,23,.96);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    padding: 16px 60px;
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    align-items: center;
  }

  .btn-primary {
    padding: 10px 24px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #000;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--font-sans);
    transition: opacity .15s, transform .1s;
    display: flex; align-items: center; gap: 8px;
  }

  .btn-primary:hover { opacity: .9; transform: translateY(-1px); }

  .btn-secondary {
    padding: 10px 20px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: none;
    color: var(--muted);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: var(--font-sans);
    transition: all .15s;
  }

  .btn-secondary:hover { border-color: var(--text); color: var(--text); }

  /* ── HERO ───────────────────────────────────────────────── */
  #heroPanel {
    padding: 60px;
    max-width: 860px;
    margin: 0 auto;
    width: 100%;
  }

  .hero-title {
    font-family: var(--font-sans);
    font-size: 42px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -.03em;
    line-height: 1.15;
    margin-bottom: 16px;
  }

  .hero-title span {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero-sub {
    font-size: 16px;
    color: var(--muted);
    line-height: 1.7;
    max-width: 560px;
    margin-bottom: 40px;
    font-family: var(--font-serif);
  }

  .hero-stats {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    margin-bottom: 48px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    min-width: 140px;
  }

  .stat-num {
    font-size: 28px;
    font-weight: 700;
    font-family: var(--font-mono);
    color: var(--accent);
    line-height: 1;
    margin-bottom: 4px;
  }

  .stat-label {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .04em;
    text-transform: uppercase;
    font-family: var(--font-sans);
  }


  /* ── PLAN NAUKI (drawer) ────────────────────────────────── */
  #planDrawer {
    display: none;
    flex-direction: column;
    gap: 0;
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 0;
    max-height: 340px;
    overflow-y: auto;
  }

  #planDrawer.open { display: flex; }

  .plan-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    cursor: pointer;
    border-top: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 2;
  }

  .plan-header:hover { background: var(--border); }

  .plan-header span {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    font-family: var(--font-sans);
  }

  .plan-header .plan-arrow {
    font-size: 10px;
    color: var(--muted);
    transition: transform .2s;
  }

  .plan-header.open .plan-arrow { transform: rotate(180deg); }

  .plan-badge {
    background: var(--accent);
    color: #000;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 10px;
    font-family: var(--font-mono);
  }

  .plan-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 12px;
    cursor: pointer;
    transition: background .12s;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    font-family: var(--font-sans);
  }

  .plan-item:hover { background: rgba(255,255,255,.04); }

  .plan-check {
    width: 16px; height: 16px;
    border-radius: 4px;
    border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 10px;
    transition: all .15s;
  }

  .plan-item.checked .plan-check {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
  }

  .plan-item.done-mod .plan-check {
    background: rgba(0,212,170,.2);
    border-color: var(--accent);
    color: var(--accent);
  }

  .plan-txt {
    flex: 1;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .plan-item.checked .plan-txt { color: var(--text); }

  .plan-go {
    margin: 8px 12px;
    padding: 9px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #000;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--font-sans);
    width: calc(100% - 24px);
    transition: opacity .15s;
    display: none;
  }

  .plan-go:hover { opacity: .85; }
  .plan-go.show { display: block; }
  /* ── SCRIM (mobile) ─────────────────────────────────────── */
  #scrim {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 90;
  }

  @media (max-width: 800px) {
    #sidebar { transform: translateX(-100%); }
    #sidebar.open { transform: translateX(0); }
    #main { margin-left: 0; }
    #menuBtn { display: block; }
    #scrim.show { display: block; }
    #contentPanel { padding: 32px 24px 80px; }
    .complete-bar { padding: 16px 24px; }

    </button>

</div>

<script>
/* ── CONFIG ──────────────────────────────────────────────── */
const MODULES = [
  { id:1,  icon:'🧱', title:'Czym są kontrole bezpieczeństwa',   sub:'Definicja, typy, cykl życia',           diff:'Podstawowy',   dur:'33 min', src:'R1',  slug:'m01_kontrole' },
  { id:2,  icon:'⚖️', title:'Podejście oparte na ryzyku',        sub:'Risk assessment, taxonomia, priorytety',diff:'Podstawowy',   dur:'33 min', src:'R2',  slug:'m02_ryzyko' },
  { id:3,  icon:'🏪', title:'Wdrożenie w małej firmie',          sub:'Ograniczone zasoby, quick wins',        diff:'Podstawowy',   dur:'33 min', src:'R3',  slug:'m03_male_firmy' },
  { id:4,  icon:'🏢', title:'Bezpieczeństwo sieci i infrastruktury', sub:'Firewalle, VPN, IDS/IPS, segmentacja', diff:'Średni', dur:'40 min', src:'R4', slug:'m04_sieci' },
  { id:5,  icon:'🌐', title:'Zarządzanie tożsamością i dostępem', sub:'IAM, MFA, Zero Trust, PAM', diff:'Średni', dur:'40 min', src:'R5', slug:'m05_iam' },
  { id:6,  icon:'🎯', title:'MITRE ATT&CK — wprowadzenie',       sub:'Framework, taktyki, techniki',          diff:'Średni',       dur:'33 min', src:'R6',  slug:'m06_mitre_intro' },
  { id:7,  icon:'🗺️', title:'Mapowanie zagrożeń do kontroli',    sub:'ATT&CK → kontrole, threat modeling',   diff:'Zaawansowany', dur:'33 min', src:'R7',  slug:'m07_mapowanie' },
  { id:8,  icon:'🛡️', title:'Wzmacnianie obrony z MITRE DEFEND', sub:'D3FEND, aktywna obrona',               diff:'Zaawansowany', dur:'33 min', src:'R8',  slug:'m08_defend' },
  { id:9,  icon:'📋', title:'Przegląd frameworków',              sub:'NIST, ISO, CIS, SOC 2 — porównanie',   diff:'Średni',       dur:'33 min', src:'R9',  slug:'m09_frameworki' },
  { id:10, icon:'🔬', title:'NIST 800-53 w praktyce',            sub:'Katalog kontroli, implementacja',       diff:'Zaawansowany', dur:'33 min', src:'R10', slug:'m10_nist800' },
  { id:11, icon:'🏆', title:'CIS 18 Controls',                   sub:'Priorytety IG1/IG2/IG3, wdrożenie',    diff:'Średni',       dur:'33 min', src:'R11', slug:'m11_cis18' },
  { id:12, icon:'⚡', title:'Zwinne bezpieczeństwo',             sub:'Agile security, DevSecOps',             diff:'Średni',       dur:'33 min', src:'R12', slug:'m12_agile' },
  { id:13, icon:'☁️', title:'Bezpieczeństwo chmury',             sub:'AWS/Azure/GCP, shared responsibility',  diff:'Zaawansowany', dur:'33 min', src:'R13', slug:'m13_cloud' },
  { id:14, icon:'🔗', title:'Bezpieczeństwo łańcucha dostaw',    sub:'Third-party risk, SBOM',                diff:'Zaawansowany', dur:'33 min', src:'R14', slug:'m14_supply_chain' },
  { id:15, icon:'🤖', title:'AI i automatyzacja w security',     sub:'ML, SOAR, AI-powered threats',          diff:'Zaawansowany', dur:'33 min', src:'R15', slug:'m15_ai' },
  { id:16, icon:'💥', title:'Awarie i odpowiedź na incydenty',   sub:'IR, BCP, DRP, forensics',               diff:'Zaawansowany', dur:'33 min', src:'R16', slug:'m16_ir' },
  { id:17, icon:'⚖️', title:'Zgodność i audyt',                  sub:'GDPR, HIPAA, PCI DSS, audyt',           diff:'Średni',       dur:'33 min', src:'R17', slug:'m17_compliance' },
  { id:18, icon:'📊', title:'Metryki i raportowanie',            sub:'KPIs, dashboardy, reporting do zarządu',diff:'Średni',       dur:'33 min', src:'R18', slug:'m18_metryki' },
  { id:19, icon:'🧰', title:'Narzędziownik praktyka',            sub:'Szablony, rejestry, metryki',           diff:'Podstawowy',   dur:'33 min', src:'R19', slug:'m19_narzedzia' },
  { id:20, icon:'🚨', title:'Systemy IDS i SIEM',               sub:'Wykrywanie intruzji, alerty',            diff:'Zaawansowany', dur:'45 min', src:'R20', slug:'m20_ids_siem' },
];

const TOTAL = MODULES.length;
const LS_KEY = 'ccp_progress_v2';

/* ── STATE ───────────────────────────────────────────────── */
let done        = new Set();
let quizDone    = {};
let completedAt = {};
let timeSpent   = {};
let quizCorrect = {};
let current     = -1;
let activeTab   = 'teoria';
let _tabStart   = null;

/* ── PERSISTENCE ─────────────────────────────────────────── */
function saveProgress() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      done: [...done],
      quizDone,
      completedAt,
      timeSpent,
      quizCorrect,
      savedAt: new Date().toISOString()
    }));
  } catch(e) {}
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.done)        d.done.forEach(id => done.add(id));
    if (d.quizDone)    Object.assign(quizDone,    d.quizDone);
    if (d.completedAt) Ocject.assign(completedAt, d.completedAt);
    if (d.timeSpent)   Object.assign(timeSpent,   d.timeSpent);
    if (d.quizCorrect) Object.assign(quizCorrect, d.quizCorrect);
  } catch(e) {}
}

function exportXML() {
  const now = new Date().toISOString();
  const doneXML = [...done].map(id => {
    const dt  = completedAt[id] ? ` completedAt="${completedAt[id]}"` : '';
    const ts  = timeSpent[id]   ? ` timeSpent="${timeSpent[id]}"` : '';
    const qr  = quizCorrect.hasOwnProperty(id) ? ` quizCorrect="${quizCorrect[id]}"` : '';
    return `    <module id="${id}" status="completed"${dt}${ts}${qr}/>`;
  }).join('\n');
  const quizXML = Object.entries(quizDone).map(([id,idx]) =>
    `    <quiz moduleId="${id}" selectedAnswer="${idx}"/>`).join('\n');
  const xml = `<?xml version="1.0" encoding="UTF-8"?>\n<ccp-progress version="2.0" exportedAt="${now}">\n  <completedModules count="${done.size}">\n${doneXML}\n  </completedModules>\n  <quizAnswers count="${Object.keys(quizDone).length}">\n${quizXML}\n  </quizAnswers>\n</ccp-progress>`;
  const blob = new Blob([xml], {type:'application/xml'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ccp-postep-${now.slice(0,10)}.xml`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function importXML() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.xml,application/xml';
  inp.onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const parser = new DOMParser();
        const doc = parser.parseFromString(ev.target.result, 'application/xml');
        if (doc.querySelector('parsererror')) { alert('Nieprawidłowy plik XML.'); return; }
        doc.querySelectorAll("module[status='completed']").forEach(el => {
          const id = parseInt(el.getAttribute('id'));
          if (!isNaN(id)) {
            done.add(id);
            const ca = el.getAttribute('completedAt');
            const ts = el.getAttribute('timeSpent');
            const qr = el.getAttribute('quizCorrect');
            if (ca) completedAt[id] = ca;
            if (ts) timeSpent[id]   = parseInt(ts);
            if (qr !== null) quizCorrect[id] = (qr === 'true');
          }
        });
        doc.querySelectorAll('quiz[moduleId]').forEach(el => {
          const id = parseInt(el.getAttribute('moduleId'));
          const ans = parseInt(el.getAttribute('selectedAnswer'));
          if (!isNaN(id) && !isNaN(ans)) quizDone[id] = ans;
        });
        saveProgress(); renderSidebar(); updateProgress(); renderHero();
        alert(`✅ Zaimportowano: ${done.size} ukończonych modułów.`);
      } catch(err) { alert('Błąd importu: ' + err.message); }
    };
    reader.readAsText(file);
  };
  inp.click();
}

/* ── SIDEBAR ─────────────────────────────────────────────── */
function renderSidebar() {
  const nav = document.getElementById('navList');
  nav.innerHTML = MODULES.map((m, i) => {
    const isDone   = done.has(m.id);
    const isActive = i === current;
    const diff = m.diff === 'Podstawowy' ? '●' : m.diff === 'Średni' ? '●●' : '●●●';
    const dateStr  = completedAt[m.id] ? _fmtDate(completedAt[m.id]) : '';
    const timeStr  = timeSpent[m.id]   ? _fmtSec(timeSpent[m.id]) : '';
    const scoreStr = quizCorrect.hasOwnProperty(m.id) ? (quizCorrect[m.id] ? '✓ OK' : '✗') : '';
    const metaExtra = isDone ? `${"{dateStr}"}${"{timeStr ? ' · '+timeStr : ''}"}` : `${"{m.src}"} · ${"{m.dur}"}`;
    return `<button class="nav-item${isActive?' active':''}${isDone?' done':''}"
      onclick="goTo(${i})" title="${m.diff}">
      <span class="nav-num">${isDone ? '✓' : m.id}</span>
      <span class="nav-txt">
        <span class="nav-title">${m.icon} ${m.title}</span>
        <span class="nav-meta">${metaExtra}</span>
      </span>
      ${isDone ? '<span class="nav-check">✓</span>' : ''}
    </button>`;
  }).join('');
}

function updateProgress() {
  const pct = Math.round((done.size / TOTAL) * 100);
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

/* ── NAVIGATION ──────────────────────────────────────────── */
function goTo(i) {
  if (i < 0 || i >= TOTAL) return;
  _saveTimeSpent();
  current = i;
  activeTab = 'teoria';
  _tabStart = Date.now();
  renderSidebar();
  document.getElementById('heroPanel').style.display = 'none';
  document.getElementById('contentPanel').style.display = 'block';
  document.getElementById('tabBar').style.display = 'flex';
  document.getElementById('completeBar').style.display = 'flex';
  closeMenu();
  loadTab('teoria');
  updateTopbar();
  window.scrollTo(0,0);
}

function goNext(delta) {
  const next = current + delta;
  if (next >= 0 && next < TOTAL) goTo(next);
}

function updateTopbar() {
  const m = MODULES[current];
  document.getElementById('topbarTitle').textContent = m.title;
  const badge = document.getElementById('topbarBadge');
  badge.style.display = 'inline-block';
  badge.className = 'topbar-badge ' +
    (m.diff === 'Podstawowy' ? 'badge-basic' :
     m.diff === 'Średni'     ? 'badge-medium' : 'badge-advanced');
  badge.textContent = m.diff;
  ['teoria','case','quiz'].forEach(t => {
    document.getElementById('tab-'+t).className = 'tab-btn' + (t===activeTab?' active':'');
  });
  const hint = document.getElementById('completeHint');
  const completeBtn = document.getElementById('completeBtn');
  if (done.has(m.id)) {
    hint.textContent = '✓ Moduł zaliczony';
    completeBtn.textContent = current < TOTAL-1 ? 'Następny →' : 'Zakończ kurs ✓';
  } else {
    hint.textContent = `Moduł ${m.id} z ${TOTAL}`;
    completeBtn.textContent = current < TOTAL-1 ? 'Zalicz i przejdź dalej →' : 'Zalicz i zakończ kurs ✓';
  }
}

function switchTab(tab) {
  _saveTimeSpent();
  activeTab = tab;
  _tabStart = Date.now();
  ['teoria','case','quiz'].forEach(t => {
    document.getElementById('tab-'+t).className = 'tab-btn' + (t===tab?' active':'');
  });
  loadTab(tab);
  window.scrollTo(0,0);
}

/* ── CONTENT LOADING ─────────────────────────────────────── */
async function loadTab(tab) {
  const panel = document.getElementById('contentPanel');
  const m = MODULES[current];

  if (tab === 'quiz') {
    renderQuiz();
    return;
  }

  panel.innerHTML = '<div class="loading"><div class="spinner"></div> Ładowanie treści…</div>';

  const suffix = tab === 'case' ? '_case' : '';
  const path   = `http://localhost:8080/modules/${m.slug}${suffix}.md`;

  try {
    const resp = await fetch(path);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const md = await resp.text();
    panel.innerHTML = `<div class="md-body">${marked.parse(md)}</div>`;
    // Post-process callouts
    panel.querySelectorAll('blockquote').forEach(bq => {
      const t = bq.textContent.trim();
      if (t.startsWith('⚠️') || t.startsWith('UWAGA')) {
        bq.className = 'callout callout-warn';
      } else if (t.startsWith('💡') || t.startsWith('WSKAZÓWKA')) {
        bq.className = 'callout callout-tip';
      } else if (t.startsWith('🚨') || t.startsWith('RYZYKO')) {
        bq.className = 'callout callout-danger';
      }
    });
  } catch(err) {
    panel.innerHTML = `
      <div style="text-align:center;padding:80px 20px;color:var(--muted)">
        <div style="font-size:48px;margin-bottom:16px">📄</div>
        <div style="font-size:16px;margin-bottom:8px">Treść modułu w przygotowaniu</div>
        <div style="font-size:13px">${path}</div>
      </div>`;
  }
}

/* ── QUIZ ─────────────────────────────────────────────────── */
async function renderQuiz() {
  const panel = document.getElementById('contentPanel');
  const m = MODULES[current];
  panel.innerHTML = '<div class="loading"><div class="spinner"></div> Ładowanie quizu…</div>';

  try {
    const resp = await fetch(`http://localhost:8080/modules/${m.slug}_quiz.json`);
    if (!resp.ok) throw new Error('brak pliku');
    const quiz = await resp.json();

    const letters = ['A','B','C','D','E'];
    const answered = quizDone.hasOwnProperty(m.id);
    const selected = quizDone[m.id];
    if (answered) _recordQuizResult(m.id, selected, quiz.correct);

    const optsHTML = quiz.options.map((opt, i) => {
      let cls = 'quiz-opt';
      if (answered) {
        if (i === quiz.correct)  cls += ' correct';
        else if (i === selected) cls += ' wrong';
        cls += ' disabled';
      }
      return `<button class="${cls}" onclick="answerQuiz(${i})" ${answered?'disabled':''}>
        <span class="opt-letter">${letters[i]}</span>
        <span>${opt}</span>
      </button>`;
    }).join('');

    const feedbackHTML = answered ? `
      <div class="quiz-feedback show ${selected === quiz.correct ? 'ok' : 'fail'}">
        ${selected === quiz.correct
          ? `✓ Poprawna odpowiedź! ${quiz.explanation || ''}`
          : `✗ Niepoprawnie. Prawidłowa odpowiedź: <strong>${quiz.options[quiz.correct]}</strong>. ${quiz.explanation || ''}`}
      </div>` : '';

    panel.innerHTML = `
      <div id="quizPanel">
        <div class="quiz-wrap">
          <div class="quiz-q">${quiz.question}</div>
          <div class="quiz-opts" id="quizOpts">${optsHTML}</div>
          ${feedbackHTML}
        </div>
      </div>`;
  } catch(err) {
    panel.innerHTML = `
      <div style="text-align:center;padding:80px 20px;color:var(--muted)">
        <div style="font-size:48px;margin-bottom:16px">❓</div>
        <div style="font-size:16px">Quiz w przygotowaniu</div>
      </div>`;
  }
}

function answerQuiz(idx) {
  const m = MODULES[current];
  if (quizDone.hasOwnProperty(m.id)) return;
  quizDone[m.id] = idx;
  saveProgress();
  renderQuiz();   // quiz wywola _recordQuizResult   // quiz sam wywola _recordQuizResult
}

/* ── COMPLETE ─────────────────────────────────────────────── */
function switchTab(tab) {
  _saveTimeSpent();
  activeTab = tab;
  _tabStart = Date.now();
  ['teoria','case','quiz'].forEach(t => {
    document.getElementById('tab-'+t).className = 'tab-btn' + (t===tab?' active':'');
  });
  loadTab(tab);
  window.scrollTo(0,0);
}

function completeModule() {
  const m = MODULES[current];
  _saveTimeSpent();
  done.add(m.id);
  completedAt[m.id] = new Date().toISOString();
  saveProgress();
  renderSidebar();
  updateProgress();
  updateTopbar();
  if (current < TOTAL - 1) goTo(current + 1);
  else renderCompletion();
}

function renderCompletion() {
  document.getElementById('heroPanel').style.display = 'block';
  document.getElementById('contentPanel').style.display = 'none';
  document.getElementById('tabBar').style.display = 'none';
  document.getElementById('completeBar').style.display = 'none';
  document.getElementById('topbarBadge').style.display = 'none';
  document.getElementById('topbarTitle').textContent = 'Cybersecurity Control Playbook';
  current = -1;
  renderSidebar();
  renderHero(true);
}

/* ── HERO ─────────────────────────────────────────────────── */
function renderHero(completed = false) {
  const panel = document.getElementById('heroPanel');
  const allDone = done.size === TOTAL;
  panel.innerHTML = `
    <div class="hero-title">
      ${allDone
        ? '🎓 Kurs <span>ukończony</span>'
        : 'Cybersecurity<br><span>Control Playbook</span>'}
    </div>
    <p class="hero-sub">
      ${allDone
        ? 'Gratulacje! Ukończyłeś wszystkie ' + TOTAL + ' modułów kursu eksperckiego.'
        : 'Kurs ekspercki oparty na książce Jasona Edwardsa (Wiley, 2025). Buduj dojrzały program cyberbezpieczeństwa od fundamentów po zaawansowane strategie.'}
    </p>
    <div class="hero-stats">
      <div class="stat-card">
        <div class="stat-num">${done.size}/${TOTAL}</div>
        <div class="stat-label">Ukończone moduły</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">${Math.round((done.size/TOTAL)*100)}%</div>
        <div class="stat-label">Postęp kursu</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">${_quizScore()}%</div>
        <div class="stat-label">Wynik quizów</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">${_totalTimeStr()}</div>
        <div class="stat-label">Czas nauki</div>
      </div>
    </div>
    <button class="btn-primary" onclick="goTo(${done.size < TOTAL ? done.size : 0})" style="font-size:15px;padding:14px 28px;">
      ${done.size === 0 ? '▶ Rozpocznij kurs' : done.size < TOTAL ? '▶ Kontynuuj — Moduł ' + (done.size+1) : '↺ Zacznij od początku'}
    </button>`;
}

/* ── MOBILE MENU ─────────────────────────────────────────── */
function toggleMenu() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('scrim').classList.toggle('show');
}

function closeMenu() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('scrim').classList.remove('show');
}

document.getElementById('scrim').addEventListener('click', closeMenu);


/* ── PLAN NAUKI ──────────────────────────────────────────── */
let todayPlan = new Set();  // moduleId zaplanowanych na dzis

function togglePlan() {
  const drawer = document.getElementById('planDrawer');
  const header = document.getElementById('planToggle');
  const arrow  = document.getElementById('planArrow');
  const isOpen = drawer.classList.contains('open');
  drawer.classList.toggle('open', !isOpen);
  header.classList.toggle('open', !isOpen);
  if (!isOpen) renderPlanList();
}

function renderPlanList() {
  const list = document.getElementById('planList');
  list.innerHTML = MODULES.map(m => {
    const isDone    = done.has(m.id);
    const isPlanned = todayPlan.has(m.id);
    const cls = isDone ? 'plan-item done-mod' : (isPlanned ? 'plan-item checked' : 'plan-item');
    const chk = isDone ? '✓' : (isPlanned ? '✓' : '');
    return `<button class="${cls}" onclick="togglePlanItem(${m.id})">
      <span class="plan-check">${chk}</span>
      <span class="plan-txt">${m.icon} ${m.title}</span>
    </button>`;
  }).join('');
  updatePlanBadge();
}

function togglePlanItem(id) {
  if (done.has(id)) return;  // juz ukonczone - nie mozna odznaczac
  if (todayPlan.has(id)) todayPlan.delete(id);
  else todayPlan.add(id);
  renderPlanList();
  updatePlanBadge();
}

function updatePlanBadge() {
  const pending = [...todayPlan].filter(id => !done.has(id));
  const badge = document.getElementById('planBadge');
  const goBtn = document.getElementById('planGoBtn');
  if (pending.length > 0) {
    badge.style.display = 'inline-block';
    badge.textContent = pending.length;
    goBtn.classList.add('show');
    goBtn.textContent = '▶ Zacznij plan (' + pending.length + ' modułów)';
  } else {
    badge.style.display = 'none';
    goBtn.classList.remove('show');
  }
}

function startPlan() {
  // Przejdz do pierwszego niezaliczonego modulu z planu
  const pending = [...todayPlan]
    .filter(id => !done.has(id))
    .sort((a,b) => a - b);
  if (pending.length === 0) return;
  const firstIdx = MODULES.findIndex(m => m.id === pending[0]);
  if (firstIdx >= 0) {
    togglePlan();  // zamknij drawer
    goTo(firstIdx);
  }
}
/* ── HELPERS ────────────────────────────────────── */
function _saveTimeSpent() {
  if (_tabStart === null || current < 0) return;
  const secs = Math.round((Date.now() - _tabStart) / 1000);
  const id = MODULES[current].id;
  timeSpent[id] = (timeSpent[id] || 0) + secs;
  _tabStart = Date.now();
}
function _fmtSec(secs) {
  if (!secs) return '';
  if (secs < 60)   return secs + 's';
  if (secs < 3600) return Math.round(secs/60) + ' min';
  return Math.floor(secs/3600) + 'h ' + Math.round((secs%3600)/60) + 'min';
}
function _totalTimeStr() {
  const total = Object.values(timeSpent).reduce((a,b)=>a+b, 0);
  return _fmtSec(total) || '0min';
}
function _fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('pl-PL', {day:'2-digit',month:'2-digit',year:'numeric'});
}
function _quizScore() {
  const total = Object.keys(quizCorrect).length;
  if (!total) return '—';
  const correct = Object.values(quizCorrect).filter(Boolean).length;
  return Math.round((correct/total)*100);
}
function _recordQuizResult(moduleId, selectedIdx, correctIdx) {
  quizCorrect[moduleId] = (selectedIdx === correctIdx);
  saveProgress();
}
/* ── INIT ───────────────────────────────────────────── */
loadProgress();
renderSidebar();
updateProgress();
renderHero();
</script>
